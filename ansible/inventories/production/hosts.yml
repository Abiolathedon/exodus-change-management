    # ================================================================
    # ENVIRONMENT TIERS - for the patching promotion pipeline.
    # Grouped by environment (test -> staging -> production), SEPARATE
    # from the functional groups above. A node can be in both.
    # Control node (automation-01) is deliberately EXCLUDED - patched
    # out-of-band, since automating a reboot of the host we run from
    # would sever the Ansible run.
    # ================================================================

    test:
      hosts:
        exodus-platform-01:

    staging:
      hosts:
        exodus-observability-01:

    production_tier:
      hosts:
        exodus-services-01:
        exodus-grafana-01:
        exodus-ingress-01:
