galaxy_info:
  author: Abiola Osota
  description: >
    Onboards a RHEL node to EXODUS centralised logging: installs Vector
    (pinned version), deploys its config from a template with the OpenSearch
    password injected from Ansible Vault, and enables the service. Ships
    journald logs to OpenSearch on exodus-logging-01.
  company: EXODUS (home lab)
  license: MIT
  min_ansible_version: "2.14"

  galaxy_tags:
    - logging
    - vector
    - opensearch
    - observability
    - rhel

dependencies: []