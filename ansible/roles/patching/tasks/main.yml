---
# tasks file for patching
# ================================================================
# Patches a single host safely. The playbook decides HOW MANY hosts
# at a time (serial). This role is the "what to do on each host".
# ================================================================

# ---- CHUNK 1: Check what updates are available (look before acting) ----
- name: Check for available updates
  # [MODULE] ansible.builtin.dnf -> the package manager for RHEL.
  ansible.builtin.dnf:
    # [PARAMETER] list=updates -> just LIST available updates, don't install.
    list: updates
  # [KEYWORD] register -> remember the result so we can see/report it.
  register: available_updates
  # [KEYWORD] changed_when: false -> checking is not a change; keep it "ok".
  changed_when: false


  # ---- Show WHAT updates are available (visibility / audit) ----
- name: Show which updates are available
  # [MODULE] ansible.builtin.debug -> print the list of available package names.
  ansible.builtin.debug:
    msg: >
      {{ inventory_hostname }} - available updates:
      {{ available_updates.results | map(attribute='name') | list }}
  # [KEYWORD] changed_when not needed - debug never changes anything.



 
# ---- CHUNK 2: Apply the updates, safely (try / catch / finally) ----
- name: Patch the host with error handling
  # [KEYWORD] block -> "TRY to do these tasks".
  block:
    - name: Apply updates (security-only by default)
      # [MODULE] ansible.builtin.dnf -> install/update packages.
      ansible.builtin.dnf:
        # [PARAMETER] name -> "*" means "consider all packages"...
        name: "*"
        # [PARAMETER] state=latest -> update to newest ALLOWED by the filters.
        state: latest
        # [PARAMETER] security -> if strategy is "security", ONLY security updates.
        security: "{{ patching_update_strategy == 'security' }}"
      # [KEYWORD] become -> root; installing packages needs privilege.
      become: true
      # [KEYWORD] register -> remember the patch result.
      register: patch_result

    # ---- Show WHAT was actually patched (visibility / audit) ----
    - name: Show what was patched
      # [MODULE] ansible.builtin.debug -> print the packages that were updated.
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }} - packages updated:
          {{ patch_result.results | default(['none - already up to date']) }}

  # [KEYWORD] rescue -> "IF the block FAILED, do this instead".
  rescue:
    - name: Report that patching failed on this host
      # [MODULE] ansible.builtin.debug -> print a clear failure message.
      ansible.builtin.debug:
        msg: "PATCHING FAILED on {{ inventory_hostname }} - halting this host, not the whole run."
    # [MODULE] ansible.builtin.fail -> mark this host as failed deliberately.
    - name: Fail this host cleanly
      ansible.builtin.fail:
        msg: "Patching failed - see above. This host stopped; others unaffected."



# ---- CHUNK 3: Check if a reboot is needed, and REPORT it (no auto-reboot) ----
- name: Check if a reboot is required
  # [MODULE] ansible.builtin.command -> run a check command.
  # 'needs-restarting -r' returns rc=1 if a reboot IS needed, rc=0 if not.
  ansible.builtin.command: needs-restarting -r
  # [KEYWORD] become -> root; the check needs privilege.
  become: true
  # [KEYWORD] register -> remember the result (we read its return code).
  register: reboot_check
  # [KEYWORD] failed_when: false -> rc=1 is NOT a failure here, it's info.
  failed_when: false
  # [KEYWORD] changed_when: false -> checking changes nothing.
  changed_when: false

- name: Report reboot status
  # [MODULE] ansible.builtin.debug -> print whether a reboot is needed.
  ansible.builtin.debug:
    msg: >
      {{ inventory_hostname }} -
      {% if reboot_check.rc == 1 %}REBOOT REQUIRED (patched a kernel/core package){% else %}no reboot needed{% endif %}
  # [KEYWORD] when -> only report if the reboot-reporting flag is on.
  when: patching_report_reboot | bool


# ---- CHUNK 4: Health check - confirm the host is still alive after patching ----
- name: Verify the host is responding (health check)
  # [MODULE] ansible.builtin.ping -> Ansible's connectivity/health test.
  ansible.builtin.ping:
  # [KEYWORD] register -> remember the health result.
  register: health_check

- name: Report health status
  # [MODULE] ansible.builtin.debug -> print the health outcome.
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} - health check: {{ health_check.ping | default('FAILED') }}"




# ---- CHUNK 5: Verify expected services are RUNNING after patching ----
- name: Gather service facts
  # [MODULE] ansible.builtin.service_facts -> collect all services' states.
  ansible.builtin.service_facts:
  # [KEYWORD] when -> only if service verification is switched on.
  when: patching_verify_services | bool

- name: Assert each expected service is running
  # [MODULE] ansible.builtin.assert -> FAIL the host if a check is false.
  ansible.builtin.assert:
    that:
      # check: this service exists AND its state is 'running'
      - "ansible_facts.services[item].state == 'running'"
    fail_msg: "CRITICAL: {{ item }} is NOT running after patching on {{ inventory_hostname }}"
    success_msg: "OK: {{ item }} is running on {{ inventory_hostname }}"
  # [KEYWORD] loop -> check every service in this host's expected_services list.
  loop: "{{ expected_services | default([]) }}"
  # [KEYWORD] when -> only if verification is on.
  when: patching_verify_services | bool