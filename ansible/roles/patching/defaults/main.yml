---
# defaults file for patching
# ================================================================
# Configurable settings for the patching role.
# These are DEFAULTS - easily overridden per host/group/tier.
# ================================================================

# How many hosts to patch at once within a tier (rolling batch size).
patching_batch_size: 1

# Update strategy: "security" = security updates ONLY (safest, default).
# Set to "all" to update everything (RISKY - can break services).
patching_update_strategy: "security"

# Whether to REPORT if a reboot is required (we do NOT auto-reboot).
patching_report_reboot: true

# Whether to verify expected_services are running AFTER patching.
patching_verify_services: true