###############################################################################
# Playbook:
#   Enterprise Linux Fleet Health Assessment
#
# Purpose:
#   Perform a read-only operational health assessment across the managed
#   Linux fleet and compare the observed runtime state with the documented
#   EXODUS enterprise operational standards.
#
# Scope:
#   - Fleet identity validation
#   - Operating system validation
#   - Enterprise service validation
#   - Security posture validation
#   - Operational health reporting
#
# Change Type:
#   Read-Only Operational Validation
#
# Impact:
#   No configuration changes.
#   No service restarts.
#   No package installation.
#   No remediation performed.
#
# Execution Standard:
#   Architecture
#   → Known Good
#   → Extract
#   → Compare
#   → Classify
#   → Report
#
# Author:
#   EXODUS Enterprise Engineering Programme
#
# Change Request:
#   CR-013
#
# Phase:
#   6.6.8
###############################################################################
---
- name: Enterprise Linux Fleet Health Assessment
  hosts: linux
  become: true
  gather_facts: true

  tasks:

    ###########################################################################
    # Phase 1: Managed Host Identity Validation
    ###########################################################################

    - name: Validate managed host identity
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_hostname }}"
          - "FQDN: {{ ansible_fqdn }}"
          - "Primary IPv4: {{ ansible_default_ipv4.address }}"

    ###########################################################################
    # Phase 2: Operating System Baseline Validation
    ###########################################################################

    - name: Validate operating system baseline
      ansible.builtin.debug:
        msg:
          - "Distribution: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - "Kernel: {{ ansible_kernel }}"
          - "Architecture: {{ ansible_architecture }}"

    ###########################################################################
    # Phase 3: Enterprise Service Discovery
    ###########################################################################

    - name: Collect service facts
      ansible.builtin.service_facts:

    ###########################################################################
    # Phase 4: Core Service Validation (Milestone 2)
    ###########################################################################

    - name: Validate core fleet services are running
      ansible.builtin.assert:
        that:
          - ansible_facts.services['sshd.service'].state == 'running'
          - ansible_facts.services['chronyd.service'].state == 'running'
          - ansible_facts.services['firewalld.service'].state == 'running'
        success_msg: "All core services (sshd, chronyd, firewalld) are running"
        fail_msg: "One or more core services are NOT running - investigate"


    ###########################################################################
    # Phase 5: Role-Specific Service Validation (Milestone 2 Step 2)
    ###########################################################################

    - name: Validate role-specific services are running
      ansible.builtin.assert:
        that:
          - ansible_facts.services[item].state == 'running'
        success_msg: "Role service {{ item }} is running"
        fail_msg: "Role service {{ item }} is NOT running - investigate"
      loop: "{{ expected_services | default([]) }}"

    
    ###########################################################################
    # Phase 6: Security Posture Validation (Milestone 2 Step 3)
    ###########################################################################

    - name: Read SSH root-login setting                            # KEYWORD name: the task's label (shows in output)
      ansible.builtin.shell: "sshd -T | grep -i permitrootlogin"   # MODULE shell: run command to read live SSH setting
      register: sshd_root_login                                    # KEYWORD register: save this task's output to a variable
      changed_when: false                                          # KEYWORD changed_when: mark read-only (never reports "changed")

    - name: Assert root SSH login is disabled                      # KEYWORD name: the task's label
      ansible.builtin.assert:                                      # MODULE assert: verify a condition is true
        that:                                                      # PARAM that: the condition(s) assert checks
          - "'permitrootlogin no' in sshd_root_login.stdout"       # condition: saved output must contain "permitrootlogin no"
        success_msg: "Root SSH login is disabled (secure)"         # PARAM success_msg: message shown if the check passes
        fail_msg: "SECURITY DRIFT: root SSH login is NOT disabled" # PARAM fail_msg: message shown if the check fails

    - name: Read SELinux enforcing mode                            # KEYWORD name: the task's label
      ansible.builtin.command: "getenforce"                        # MODULE command: prints Enforcing/Permissive/Disabled
      register: selinux_mode                                       # KEYWORD register: save this task's output to a variable
      changed_when: false                                          # KEYWORD changed_when: mark read-only

    - name: Assert SELinux is enforcing                            # KEYWORD name: the task's label
      ansible.builtin.assert:                                      # MODULE assert: verify a condition is true
        that:                                                      # PARAM that: the condition assert checks
          - "selinux_mode.stdout == 'Enforcing'"                   # condition: saved output must equal exactly "Enforcing"
        success_msg: "SELinux is enforcing (secure)"               # PARAM success_msg: message shown if the check passes
        fail_msg: "SECURITY DRIFT: SELinux is NOT enforcing"       # PARAM fail_msg: message shown if the check fails        

